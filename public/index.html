<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>丼樂食｜線上點餐</title>
  <style>
    :root{--bg:#161410;--card:#24211c;--ink:#fbf5e9;--muted:#bdb3a1;--red:#d84832;--gold:#e8bb62;--line:#4a4032}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 25% -10%,#594022 0,transparent 34rem),var(--bg);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}header{padding:38px 0 24px;text-align:center;border-bottom:1px solid var(--line)}.brand{font-size:clamp(2.4rem,7vw,4.3rem);letter-spacing:.16em;margin:0;color:var(--gold)}.tagline,.category,#status,footer{color:var(--muted)}.tagline{margin:5px 0 0;letter-spacing:.12em}.notice{margin:20px 0;padding:12px 16px;border:1px solid #765228;background:#332619;color:#f7d792;border-radius:10px;text-align:center}h2{margin:42px 0 16px;font-size:1.45rem;color:var(--gold)}h2 small{font-size:.85rem;color:var(--muted);font-weight:normal}.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.item{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--card)}.photo{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#3b3329}.photo.empty{background:linear-gradient(140deg,#443523,#211d17)}.item-body{padding:16px}.title-row{display:flex;gap:8px;align-items:baseline;justify-content:space-between}h3{margin:0;font-size:1.15rem}.price{color:var(--gold);white-space:nowrap;font-weight:bold}.category{font-size:.82rem;margin:4px 0 13px}.field-label{display:block;font-size:.9rem;margin:13px 0 6px;color:#e4d8c5}select,input,textarea{width:100%;background:#171511;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}.inline{display:flex;align-items:center;gap:8px}.inline input{width:70px}.option-list{display:grid;gap:7px;margin:8px 0}.choice{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#1b1814;font-size:.9rem}.choice input{width:auto;accent-color:var(--red)}.add{width:100%;margin-top:16px;padding:11px;border:0;border-radius:8px;color:white;background:var(--red);font-weight:bold}.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.extra{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}.extra h3{font-size:1rem}.cart{position:sticky;bottom:0;z-index:2;margin:44px 0 0;padding:20px;background:#201b15f7;border:1px solid var(--gold);border-radius:15px 15px 0 0}.cart-lines{max-height:220px;overflow:auto}.cart-line{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.cart-line span:first-child{flex:1}.remove{border:0;border-radius:6px;background:transparent;color:#ed927f;font-size:1.2rem}.total{display:flex;justify-content:space-between;align-items:center;padding-top:14px;font-size:1.25rem}.total strong{color:var(--gold);font-size:1.7rem}.order-form{margin:20px 0 50px;padding:22px;border-radius:15px;background:var(--card);border:1px solid var(--line)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.submit{margin-top:18px;width:100%;padding:14px;border:0;border-radius:9px;background:var(--gold);color:#261b0d;font-weight:bold;font-size:1.1rem}.submit:disabled,.add:disabled{opacity:.5;cursor:not-allowed}.message{margin:12px 0;padding:12px;border-radius:8px;display:none}.message.show{display:block}.message.ok{background:#24442e;color:#c5edce}.message.error{background:#54271f;color:#ffd4ca}footer{text-align:center;padding:20px 0 100px;font-size:.85rem}@media(max-width:600px){.wrap{width:min(100% - 22px,1120px)}header{padding-top:24px}.form-grid{grid-template-columns:1fr}.brand{font-size:2.5rem}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1 class="brand">丼樂食</h1><p class="tagline">DON HAPPY FOOD · 新北市樹林區中華路353號-1</p></div></header>
  <main class="wrap">
    <p class="notice">目前僅開放自取｜營業時間 11:00–21:00｜每週三公休</p>
    <p id="status">正在載入今日菜單…</p>
    <section><h2>主食 <small>每份主食可選 1 份套餐</small></h2><div id="mains" class="menu-grid"></div></section>
    <section><h2>單點加購</h2><div id="singles" class="extras"></div></section>
    <section class="cart"><h2 style="margin:0 0 10px">你的訂單</h2><div id="cartLines" class="cart-lines">尚未加入餐點</div><div class="total"><span>訂單總額</span><strong id="total">NT$ 0</strong></div></section>
    <form id="orderForm" class="order-form"><h2 style="margin-top:0">取餐與聯絡資料</h2><div class="form-grid">
      <label>訂購人姓名<input required maxlength="60" name="name" autocomplete="name"></label><label>手機號碼<input required maxlength="30" name="phone" inputmode="tel" autocomplete="tel"></label>
      <label>訂購人 Email<input required maxlength="160" type="email" name="email" autocomplete="email"></label><label>取餐時間<input required type="time" name="pickupTime" min="11:00" max="21:00"></label>
      <label class="full">調味需求<input maxlength="300" name="seasoning" placeholder="例如：醬汁另外放、不要蔥"></label><label class="full">特別需求<textarea maxlength="500" name="specialRequest" rows="2"></textarea></label><label class="full">其他備註<textarea maxlength="500" name="note" rows="2"></textarea></label>
    </div><p class="notice">送出後將寄送訂單副本至你的 Email；如需取消訂單，請先來電聯繫。</p><div id="message" class="message"></div><button id="submit" class="submit" type="submit">確認送出訂餐</button></form>
  </main><footer>丼樂食 · 線上點餐系統</footer>
  <script>
    const state={mains:[],addOns:[],cart:[]},currency=v=>"NT$ "+Number(v).toLocaleString("zh-TW"),esc=v=>String(v||"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x])),pic=x=>x.imageUrl?'<img class="photo" loading="lazy" src="'+esc(x.imageUrl)+'" alt="'+esc(x.name)+'">':'<div class="photo empty"></div>',purpose=n=>state.addOns.filter(x=>x.purpose===n);
    function choice(items,name){return items.map(x=>'<label class="choice"><input type="'+(items[0].multiple?"checkbox":"radio")+'" name="'+name+'" value="'+esc(x.name)+'"><span>'+esc(x.name)+'（'+currency(x.price)+'）</span></label>').join("")}
    function renderMains(){const packs=purpose("套餐"),extras=purpose("主餐加購"),opts=purpose("套餐選項");document.querySelector("#mains").innerHTML=state.mains.map((main,i)=>{let id="main-"+i,groups=[...new Set(opts.map(x=>x.category))],extraGroups=[...new Set(extras.map(x=>x.category))];return '<article class="item" data-main="'+i+'">'+pic(main)+'<div class="item-body"><div class="title-row"><h3>'+esc(main.name)+'</h3><span class="price">'+currency(main.price)+'</span></div><p class="category">'+esc(main.category)+'</p><label class="field-label">數量</label><div class="inline"><input class="qty" type="number" min="1" max="99" value="1"><span>份</span></div>'+(packs.length?'<label class="field-label">套餐（最多一份）</label><select class="package"><option value="">不加套餐</option>'+packs.map(x=>'<option value="'+esc(x.name)+'">'+esc(x.name)+'（'+currency(x.price)+'）</option>').join("")+'</select>':'')+(groups.length?'<div class="package-options" hidden>'+groups.map((g,n)=>'<label class="field-label">'+esc(g)+'</label><div class="option-list">'+choice(opts.filter(x=>x.category===g),id+"-opt-"+n)+'</div>').join("")+'</div>':'')+(extras.length?'<label class="field-label">主餐加購</label>'+extraGroups.map((g,n)=>'<label class="field-label">'+esc(g)+'</label><div class="option-list">'+choice(extras.filter(x=>x.category===g),id+"-extra-"+n)+'</div>').join(""):'')+'<button type="button" class="add main-add">加入訂單</button></div></article>'}).join("")||"<p>目前沒有可點選的主食。</p>";document.querySelectorAll(".package").forEach(s=>s.addEventListener("change",()=>s.parentElement.querySelector(".package-options").hidden=!s.value));document.querySelectorAll(".main-add").forEach(b=>b.addEventListener("click",addMain))}
    function renderSingles(){const singles=state.addOns.filter(x=>x.purpose==="單點加購"||x.source==="single");document.querySelector("#singles").innerHTML=singles.map((x,i)=>'<article class="extra" data-single="'+i+'"><div class="title-row"><h3>'+esc(x.name)+'</h3><span class="price">'+currency(x.price)+'</span></div><p class="category">'+esc(x.category)+'</p><div class="inline"><input class="qty" type="number" min="1" max="99" value="1"><button class="add single-add" type="button">加入</button></div></article>').join("")||"<p>目前沒有單點加購品項。</p>";document.querySelectorAll(".single-add").forEach(b=>b.addEventListener("click",addSingle))}
    function addMain(e){const card=e.target.closest("[data-main]"),main=state.mains[+card.dataset.main],q=+card.querySelector(".qty").value;state.cart.push({name:main.name,catalogName:main.name,price:main.price,quantity:q,type:"main"});const s=card.querySelector(".package");if(s&&s.value){const p=purpose("套餐").find(x=>x.name===s.value);state.cart.push({name:p.name+"（"+main.name+"）",catalogName:p.name,price:p.price,quantity:q,type:"package"});card.querySelectorAll(".package-options input:checked").forEach(i=>{const x=purpose("套餐選項").find(x=>x.name===i.value);state.cart.push({name:x.name+"（套餐）",catalogName:x.name,price:x.price,quantity:q,type:"packageOption"})})}card.querySelectorAll('[name*="-extra"]:checked').forEach(i=>{const x=purpose("主餐加購").find(x=>x.name===i.value);state.cart.push({name:x.name+"（"+main.name+"）",catalogName:x.name,price:x.price,quantity:q,type:"extra"})});renderCart()}
    function addSingle(e){const card=e.target.closest("[data-single]"),a=state.addOns.filter(x=>x.purpose==="單點加購"||x.source==="single")[+card.dataset.single];state.cart.push({name:a.name,catalogName:a.name,price:a.price,quantity:+card.querySelector(".qty").value,type:"single"});renderCart()}
    function renderCart(){const target=document.querySelector("#cartLines"),total=state.cart.reduce((s,x)=>s+x.price*x.quantity,0);target.innerHTML=state.cart.length?state.cart.map((x,i)=>'<div class="cart-line"><span>'+esc(x.name)+" × "+x.quantity+'</span><b>'+currency(x.price*x.quantity)+'</b><button class="remove" type="button" data-remove="'+i+'">×</button></div>').join(""):"尚未加入餐點";document.querySelector("#total").textContent=currency(total);document.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>{state.cart.splice(+b.dataset.remove,1);renderCart()}))}
    function message(text,type){const e=document.querySelector("#message");e.className="message show "+type;e.textContent=text}async function load(){try{const r=await fetch("/api/menu");if(!r.ok)throw Error("菜單暫時無法讀取");Object.assign(state,await r.json());renderMains();renderSingles();document.querySelector("#status").textContent="請選擇餐點與份數。"}catch(e){document.querySelector("#status").textContent="無法載入菜單："+e.message}}document.querySelector("#orderForm").addEventListener("submit",async e=>{e.preventDefault();let f=new FormData(e.target),total=state.cart.reduce((s,x)=>s+x.price*x.quantity,0);if(!state.cart.length||!total)return message("請至少加入一項餐點。","error");let b=document.querySelector("#submit");b.disabled=true;try{let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer:{name:f.get("name"),phone:f.get("phone"),email:f.get("email")},pickupMethod:"自取",pickupTime:f.get("pickupTime"),seasoning:f.get("seasoning"),specialRequest:f.get("specialRequest"),note:f.get("note"),lines:state.cart,total})}),x=await r.json();if(!r.ok)throw Error(x.error||"送單失敗");message("訂單已送出！訂單編號："+x.orderId+"。"+x.notificationStatus,"ok");state.cart=[];renderCart();e.target.reset()}catch(x){message(x.message,"error")}finally{b.disabled=false}});load();
  </script>
</body></html>
